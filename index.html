<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSU Project Dashboard</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/access-pending.css">
</head>
<body class="routing-body">
  <section class="routing-shell">
    <header>
      <h1>TSU Project Dashboard</h1>
      <span class="status-pill">Choose Access</span>
    </header>
    <main class="pending-main">
      <section class="pending-card">
        <h2>Welcome to the TSU Project Dashboard</h2>
        <p class="muted">Choose how you want to continue. Guests can browse live project information without editing it.</p>
        <div data-message class="message" hidden></div>
        <div class="button-row access-choice-row">
          <a class="primary button-link" href="access-pending.html" data-request-access>Request Access</a>
          <button class="secondary" type="button" data-guest-access>View as Guest</button>
        </div>
        <p class="muted access-note">Guest view includes live, read-only project pages. Request access for your assigned workspace.</p>
      </section>
    </main>
  </section>
  <script src="js/index.js"></script>
</body>
</html>
